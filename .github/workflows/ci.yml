name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pins:
    name: Scripts and pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm test
      # Fails if a pinned tag disappeared or was moved to another commit upstream.
      - run: node scripts/upstream.mjs verify

  relaycast-image:
    name: Build and smoke-test relaycast
    runs-on: ubuntu-latest
    needs: pins
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: ./.github/actions/build-relaycast
        with:
          image: outpost-relaycast:ci

  # relay is not built here, but its patch queue must still apply to the pin.
  relay-patches:
    name: Relay patches apply
    runs-on: ubuntu-latest
    needs: pins
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/upstream.mjs checkout relay --dir .upstream/relay
